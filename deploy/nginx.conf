server {
    listen 80;
    server_name _;

    # 只允许 CloudFront IP 段访问（安全加固）
    # CloudFront 会带这个 header，用于验证来源
    location / {
        # 验证 CloudFront 自定义 Header（在 CloudFront 里设置）
        if ($http_x_cloudfront_secret != "REPLACE_WITH_YOUR_SECRET") {
            return 403;
        }

        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE 流式响应支持（batch_create_stream 用到）
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;

        # 长时间查询支持（配额查询可能需要 60+ 秒）
        proxy_read_timeout 300s;      # 读取超时：5 分钟
        proxy_connect_timeout 10s;    # 连接超时：10 秒
        proxy_send_timeout 300s;      # 发送超时：5 分钟
    }

    # 特殊配置：为大量数据查询优化
    location ~ ^/api/(query_quotas|export_quotas_excel|batch_create_stream) {
        if ($http_x_cloudfront_secret != "REPLACE_WITH_YOUR_SECRET") {
            return 403;
        }

        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 这些端点需要更长的超时
        proxy_read_timeout 600s;      # 读取超时：10 分钟
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;      # 发送超时：10 分钟
        
        # 禁用缓冲，实时流式传输
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
    }
}
